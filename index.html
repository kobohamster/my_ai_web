<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요 👋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .avatar { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; color: #333; margin-bottom: 8px; }
    p { color: #666; line-height: 1.7; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      margin: 4px;
    }
    .footer { margin-top: 24px; font-size: 0.8rem; color: #aaa; }
    .projects { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    .project-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      text-decoration: none;
      color: #333;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
      background: #fafafa;
    }
    .project-btn:hover {
      border-color: #667eea;
      background: #f0f1ff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.15);
    }
    .project-btn .icon { font-size: 1.4rem; }
    .project-btn .meta { text-align: left; }
    .project-btn .meta span { display: block; font-size: 0.75rem; color: #888; font-weight: 400; margin-top: 2px; }
    .section-label { margin-top: 24px; font-size: 0.75rem; color: #aaa; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🙋</div>
    <h1>안녕하세요!</h1>
    <p>웹 개발을 배우고 있는 <strong>kobohamster</strong>입니다.<br>이 페이지는 GitHub Pages로 배포된 첫 번째 웹사이트입니다.</p>
    <div>
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">React</span>
    </div>
    <p class="section-label">Projects</p>
    <div class="projects">
      <a href="./community/" class="project-btn">
        <span class="icon">🌙</span>
        <div class="meta">
          Until Dawn
          <span>영원히 일을 미루는 모임 · React + Supabase</span>
        </div>
      </a>
      <a href="./chocorate/" class="project-btn" style="border-color:#ca1c1d">
        <span class="icon">🍫</span>
        <div class="meta">
          CHOCORATE
          <span>초콜릿 품평 커뮤니티 · React + MUI + Supabase</span>
        </div>
      </a>
      <a href="./ottv/" class="project-btn" style="border-color:#1976d2">
        <span class="icon">🎥</span>
        <div class="meta">
          MOV
          <span>OTT 콘텐츠 소개 랜딩페이지 · React + MUI</span>
        </div>
      </a>
    </div>
    <div class="footer">✨ GitHub Pages로 배포됨</div>
  </div>
</body>
</html>
