<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요 👋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .avatar { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; color: #333; margin-bottom: 8px; }
    p { color: #666; line-height: 1.7; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      margin: 4px;
    }
    .footer { margin-top: 24px; font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🙋</div>
    <h1>안녕하세요!</h1>
    <p>웹 개발을 배우고 있는 <strong>kobohamster</strong>입니다.<br>이 페이지는 GitHub Pages로 배포된 첫 번째 웹사이트입니다.</p>
    <div>
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">React</span>
    </div>
    <div class="footer">✨ GitHub Pages로 배포됨</div>
  </div>
</body>
</html>
