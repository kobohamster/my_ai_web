name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build my-community
        working-directory: lecture1/my-community
        run: |
          npm install
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build CHOCORATE (mini_sns)
        working-directory: lecture1/mini_sns
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build my-ott
        working-directory: lecture1/my-ott
        run: |
          npm install
          npm run build

      - name: Build my-ottv
        working-directory: lecture1/my-ottv
        run: |
          npm install
          npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy/community
          mkdir -p _deploy/chocorate
          mkdir -p _deploy/ott
          mkdir -p _deploy/ottv
          cp index.html _deploy/
          cp -r lecture1/my-community/dist/. _deploy/community/
          cp -r lecture1/mini_sns/dist/. _deploy/chocorate/
          cp -r lecture1/my-ott/dist/. _deploy/ott/
          cp -r lecture1/my-ottv/dist/. _deploy/ottv/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
